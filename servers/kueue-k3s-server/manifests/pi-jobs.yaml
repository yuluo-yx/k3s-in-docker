apiVersion: batch/v1
kind: Job
metadata:
  name: pi-job-1
  namespace: default
  labels:
    demo: kueue-pi
    kueue.x-k8s.io/queue-name: default
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        demo: kueue-pi
    spec:
      restartPolicy: Never
      containers:
        - name: pi
          image: rancher/klipper-helm:v0.9.17-build20260422
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
          args:
            - |
              echo "${JOB_NAME}: 开始计算 π"
              # 使用 bc 任意精度运算，并增加 10 位保护精度。
              digits=100
              guard_digits=$((digits + 10))
              pi="$(printf 'scale=%s; p=4*a(1); scale=%s; p/1\n' \
                "${guard_digits}" "${digits}" | \
                BC_LINE_LENGTH=0 bc -l)"
              printf 'pi=%s digits=%s\n' "${pi}" "${digits}"
              sleep 12
              echo "${JOB_NAME}: 计算完成"
          env:
            - name: JOB_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: "3"
              memory: 128Mi
            limits:
              cpu: "3"
              memory: 256Mi
---
